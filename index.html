<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Gunguessr</title>
    <link rel="stylesheet" href="./assets/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./main.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="./assets/lib/jquery.min.js" type="text/javascript"></script>

    <link href="./assets/lib/owl.carousel.css" rel="stylesheet" />
    <script src="./assets/lib/owl.carousel.js"></script>
</head>

<body>
    <img src="logo.png" alt="Logo" class="center">

    <div style="padding: 20px;"></div>

    <h1 class="introText">Interactive gun learning game.</h1>

    <div class="padding">
        <div id="owl-carousel">
            <div class="item"><img
                    src="assets/img/guns/m52nlUu.png" />
            </div>
            <div class="item"><img
                    src="assets/img/guns/r6tl7h2.png" />
            </div>
            <div class="item"><img
                    src="assets/img/guns/JM6j5jd.png" /></div>
            <div class="item"><img
                    src="assets/img/guns/vbihDFs.png" />
            </div>
            <div class="item"><img
                    src="assets/img/guns/e77fQ8T.png" />
            </div>
            <div class="item"><img
                    src="assets/img/guns/6RUjKgw.png" />
            </div>
            <div class="item"><img
                    src="assets/img/guns/X6n4mA6.png" />
            </div>
        </div>
    </div>

    <div class="stats">
        <section class="statistics">
            <div class="stats-container">
                <div class="stats-item" style="visibility: visible;">
                    <p id="guns" class="highlight">0</p>
                    <span class="stats-description">Guns</span>
                </div>
                <div class="stats-item" style="visibility: visible;">
                    <p id="information" class="highlight">0</p>
                    <span class="stats-description">Words of gun history</span>
                </div>
            </div>
        </section>
    </div>
    <h1 class="outroText">What are you waiting for?</h1>

    <div class="buttons">
        <button onclick="window.location.href = 'game.html'"
            class="button">Start playing!</button>
    </div>

    <script src="js/countdown.js"></script>
    <script src="js/slide.js"></script>
</body>

</html>
